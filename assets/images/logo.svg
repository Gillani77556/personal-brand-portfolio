<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="logo-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131d33"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="logo-grad-emerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge Container -->
  <rect width="40" height="40" rx="10" fill="url(#logo-grad-bg)"/>
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  <!-- Stylized Monogram A -->
  <path d="M11 29L18.8 11.5H21.2L29 29H24.8L23.1 24.8H16.9L15.2 29H11ZM18.1 21.6H21.9L20 16.8L18.1 21.6Z" fill="#FAFAFA"/>
  <!-- Rising SEO Growth Arrow (Dynamic Angle) -->
  <path d="M23 16.5L30 9.5M30 9.5H24.5M30 9.5V15" stroke="url(#logo-grad-emerald)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#logo-glow)"/>
  <circle cx="30" cy="9.5" r="1.6" fill="#6EE7B7"/>
</svg>